services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: workflow_builder
      MYSQL_USER: workflow
      MYSQL_PASSWORD: workflow
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - workflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/workflow_builder?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Bangkok
      DB_USERNAME: workflow
      DB_PASSWORD: workflow
      CORS_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  workflow_mysql_data:
